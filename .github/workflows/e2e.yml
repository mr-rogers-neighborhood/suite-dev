name: E2E

# The cross-app suite runs real staged binaries from all six repositories, so it
# needs a layout of siblings and a display. Nightly and on demand; never a gate
# on a push, because a failure here is usually the runner rather than the change.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: "1"

jobs:
  cross-app:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      # The staging script resolves siblings as ../suite-<name>, so the clones
      # are mirrored one level up from the workspace rather than nested inside it.
      - name: Check out the sibling repositories
        run: |
          set -euo pipefail
          for repo in start sync canvas planner budget; do
            git clone --depth 1 \
              "https://github.com/${GITHUB_REPOSITORY_OWNER}/suite-${repo}.git" \
              "${RUNNER_TEMP}/suite-${repo}"
            ln -s "${RUNNER_TEMP}/suite-${repo}" "../suite-${repo}"
          done

      - name: Install every repository
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          for repo in start sync canvas planner budget; do
            (cd "../suite-${repo}" && pnpm install --frozen-lockfile)
          done

      # Electron needs the usual Chromium shared libraries; this installs them
      # without downloading a browser we do not use.
      - name: Install the display and shared libraries
        run: sudo npx --yes playwright install-deps chromium

      - name: Stage the real binaries
        run: pnpm apps:stage

      - name: Run the cross-app suite
        run: xvfb-run -a pnpm e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
