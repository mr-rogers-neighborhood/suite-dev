name: CI

# The push gate. Cross-process work lives in e2e.yml, which needs five sibling
# repositories and a display, so it runs on demand instead of on every push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "1"
  # Staging is what needs the Electron binary, and staging is not in this job.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  check:
    # Pinned: the runner image migrates on its own schedule, and an Electron build
    # should not go red for a reason that has nothing to do with this change.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format, lint and unit tests
        run: pnpm check
